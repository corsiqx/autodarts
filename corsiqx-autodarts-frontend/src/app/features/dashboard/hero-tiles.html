@if (live()) {
  <app-live-match-panel class="enter-up" />
} @else {
  <div class="grid gap-3 sm:grid-cols-2 sm:gap-4">
    <a routerLink="/play" class="hero-tile group bg-linear-to-br from-[#1d4fd8] via-accent to-sky">
      <span class="hero-tile__shape bg-white/10" aria-hidden="true"></span>
      <span class="hero-tile__shape hero-tile__shape--2 bg-board/15" aria-hidden="true"></span>
      <!-- Player cut-out reaches a little below the card edge, so scaling and tilting on hover never shows a gap at the bottom. -->
      <img
        src="players/luke-littler.webp"
        alt=""
        width="554"
        height="520"
        class="pointer-events-none absolute -bottom-[7%] right-1 h-[104%] w-auto max-w-[58%] origin-bottom object-contain object-bottom drop-shadow-[0_10px_24px_rgb(7_13_31/0.45)] transition-transform duration-500 ease-out-expo select-none group-hover:scale-[1.08] group-hover:-rotate-3 sm:right-3"
        loading="lazy"
        decoding="async"
      />
      <span class="relative mt-auto grid max-w-[70%] gap-1 [text-shadow:0_2px_14px_rgb(7_13_31/0.45)]">
        <span class="font-display text-[2.1rem] leading-none font-bold uppercase italic tracking-tight sm:text-5xl">Jetzt spielen</span>
        <span class="text-sm font-medium text-white/85">Allein, mit Gästen oder gegen einen Bot</span>
      </span>
    </a>

    <a
      href="https://play.autodarts.com/online"
      target="_blank"
      rel="noopener"
      class="hero-tile group bg-linear-to-br from-[#0b5f86] via-[#0e9fcf] to-[#2fe0c4]"
    >
      <span class="hero-tile__shape bg-white/10" aria-hidden="true"></span>
      <span class="hero-tile__shape hero-tile__shape--2 bg-board/15" aria-hidden="true"></span>
      <!-- Player cut-out reaches a little below the card edge, so scaling and tilting on hover never shows a gap at the bottom. -->
      <img
        src="players/nathan-aspinall.webp"
        alt=""
        width="314"
        height="520"
        class="pointer-events-none absolute -bottom-[7%] right-1 h-[104%] w-auto max-w-[58%] origin-bottom object-contain object-bottom drop-shadow-[0_10px_24px_rgb(7_13_31/0.45)] transition-transform duration-500 ease-out-expo select-none group-hover:scale-[1.08] group-hover:rotate-3 sm:right-3"
        loading="lazy"
        decoding="async"
      />
      @if (online(); as online) {
        <span
          class="relative inline-flex w-fit items-center gap-1.5 rounded-full bg-board/80 px-2.5 py-1 text-xs font-semibold text-bone"
        >
          <span class="size-1.5 rounded-full bg-emerald-400" aria-hidden="true"></span>{{ online }} Spieler online
        </span>
      }
      <span class="relative mt-auto grid max-w-[70%] gap-1 [text-shadow:0_2px_14px_rgb(7_13_31/0.45)]">
        <span class="font-display text-[2.1rem] leading-none font-bold uppercase italic tracking-tight sm:text-5xl">Gegner finden</span>
        <span class="text-sm font-medium text-white/85">Passend zu deinem Level</span>
      </span>
      <span class="sr-only">(öffnet Autodarts Play)</span>
    </a>
  </div>
}
