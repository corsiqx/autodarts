server {
    listen 80 default_server;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico { try_files $uri =404; log_not_found off; access_log off; }

    # Files with a build hash in their name (production: main-ABCD1234.js) never change.
    location ~* "-[A-Z0-9]{8}\.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed assets (development builds) must be revalidated, or browsers keep an old app.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}